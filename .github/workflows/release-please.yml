# Keeps a "chore(main): release x.y.z" PR up to date (CHANGELOG.md + version).
# Merging it creates the vX.Y.Z tag and the GitHub release, then publishes
# that tag. The publish job lives in this workflow (not on "push: tags")
# because a tag created with GITHUB_TOKEN does not trigger other workflows.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # npm Trusted Publishing (OIDC): no NPM_TOKEN secret. On npmjs.com, add
  # Pathly-Monitoring/pathly-sdk-typescript, workflow release-please.yml,
  # environment npm as trusted publisher of @pathly/sdk.
  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # npm only signs provenance for public source repositories.
      - name: Repository must be public
        if: github.event.repository.private
        run: |
          echo "::error::npm provenance requires a public repository. Make this repository public before releasing."
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1
      - run: npm ci --no-audit --fund=false
      # prepublishOnly runs the tests and the build.
      - run: npm publish --provenance --access public
